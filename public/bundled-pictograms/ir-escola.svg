<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#EFF6FF"/>
  <!-- Fachada da Escola -->
  <rect x="22" y="44" width="56" height="42" fill="#F8FAFC" stroke="#1E40AF" stroke-width="3"/>
  <!-- Telhado triangular -->
  <polygon points="16,44 50,18 84,44" fill="#EF4444" stroke="#B91C1C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Relógio na torre -->
  <circle cx="50" cy="36" r="7" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2"/>
  <line x1="50" y1="36" x2="50" y2="32" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="53" y2="36" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
  <!-- Porta da escola -->
  <rect x="42" y="62" width="16" height="24" rx="2" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
  <!-- Janelas -->
  <rect x="28" y="52" width="10" height="10" rx="1.5" fill="#BAE6FD" stroke="#1E40AF" stroke-width="1.5"/>
  <rect x="62" y="52" width="10" height="10" rx="1.5" fill="#BAE6FD" stroke="#1E40AF" stroke-width="1.5"/>
</svg>
