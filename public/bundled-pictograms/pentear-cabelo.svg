  <!-- Fios de cabelo brilhantes -->
  <path d="M18 36 Q32 20 40 38" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
  <path d="M16 48 Q28 32 38 50" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
