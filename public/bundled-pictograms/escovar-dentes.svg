<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#E0F2FE"/>
  <!-- Dente alegre -->
  <path d="M30 40 C30 24 45 24 50 32 C55 24 70 24 70 40 C70 56 65 78 58 78 C54 78 52 66 50 66 C48 66 46 78 42 78 C35 78 30 56 30 40 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Brilho no dente -->
  <path d="M36 34 Q42 29 46 32" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Escova de dente inclinada -->
  <g transform="rotate(-30 50 50)">
    <!-- Cabo -->
    <rect x="75" y="44" width="38" height="12" rx="6" fill="#F43F5E" stroke="#BE123C" stroke-width="2.5"/>
    <rect x="52" y="46" width="25" height="8" rx="3" fill="#FB7185"/>
    <!-- Cerdas -->
    <rect x="42" y="36" width="22" height="10" rx="2" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <line x1="47" y1="36" x2="47" y2="46" stroke="#0284C7" stroke-width="1.5"/>
    <line x1="53" y1="36" x2="53" y2="46" stroke="#0284C7" stroke-width="1.5"/>
    <line x1="58" y1="36" x2="58" y2="46" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Espuma de pasta -->
    <circle cx="48" cy="33" r="5" fill="#38BDF8"/>
    <circle cx="56" cy="34" r="4" fill="#E0F2FE"/>
  </g>
  <!-- Estrelas de brilho limpo -->
  <path d="M76 22 L78 28 L84 30 L78 32 L76 38 L74 32 L68 30 L74 28 Z" fill="#FBBF24"/>
  <circle cx="24" cy="50" r="3" fill="#38BDF8"/>
  <circle cx="28" cy="60" r="2" fill="#7DD3FC"/>
</svg>
