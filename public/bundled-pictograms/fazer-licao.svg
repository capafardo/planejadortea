<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#EFF6FF"/>
  <!-- Caderno aberto -->
  <rect x="20" y="24" width="60" height="56" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <!-- Linhas do caderno -->
  <line x1="30" y1="36" x2="70" y2="36" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="46" x2="70" y2="46" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="56" x2="70" y2="56" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="66" x2="54" y2="66" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Espiral do caderno -->
  <circle cx="20" cy="32" r="3" fill="#64748B"/>
  <circle cx="20" cy="44" r="3" fill="#64748B"/>
  <circle cx="20" cy="56" r="3" fill="#64748B"/>
  <circle cx="20" cy="68" r="3" fill="#64748B"/>
  <!-- Lápis escrevendo -->
  <g transform="rotate(35 68 50)">
    <rect x="64" y="30" width="8" height="34" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <polygon points="64,64 72,64 68,74" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
    <polygon points="66,70 70,70 68,74" fill="#1E293B"/>
    <rect x="64" y="26" width="8" height="6" rx="1.5" fill="#F43F5E"/>
  </g>
</svg>
