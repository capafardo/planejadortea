    <!-- Cerdas -->
    <circle cx="43" cy="28" r="2.5" fill="#EDE9FE"/>
    <circle cx="57" cy="28" r="2.5" fill="#EDE9FE"/>
    <circle cx="50" cy="35" r="2.5" fill="#EDE9FE"/>
    <circle cx="43" cy="42" r="2.5" fill="#EDE9FE"/>
    <circle cx="57" cy="42" r="2.5" fill="#EDE9FE"/>
    <circle cx="50" cy="49" r="2.5" fill="#EDE9FE"/>
    <circle cx="50" cy="56" r="2.5" fill="#EDE9FE"/>
