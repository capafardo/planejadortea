<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#F1F5F9"/>
  <!-- Placa do interruptor -->
  <rect x="28" y="20" width="44" height="60" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="3.5"/>
  <!-- Botão do interruptor (posição desligada) -->
